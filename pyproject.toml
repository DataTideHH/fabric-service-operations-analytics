[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-service-operations-analytics"
version = "0.2.0"
description = "Tested local Medallion pipeline for a Microsoft Fabric service-operations analytics portfolio project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<4",
  "pyarrow>=17,<30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
service-operations = "service_operations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
