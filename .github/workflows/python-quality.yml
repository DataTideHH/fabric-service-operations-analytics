name: Python quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-service-operations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run Ruff lint checks
        run: python -m ruff check src tests

      - name: Verify Ruff formatting
        run: python -m ruff format --check src tests

      - name: Run pytest suite
        run: python -m pytest

      - name: Generate deterministic synthetic source
        run: >-
          python -m service_operations generate
          --output .ci-output/service_requests.csv

      - name: Verify generated source fingerprint
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          source = Path(".ci-output/service_requests.csv").read_bytes()
          digest = hashlib.sha256(source).hexdigest()
          expected = "292ed8fb2857e3927936a5b3ca002492b146875d04baee77a9322de287db8914"
          if digest != expected:
              raise SystemExit(f"Unexpected generated source fingerprint: {digest}")
          print("Synthetic source fingerprint passed.")

      - name: Validate expected data-quality controls
        run: >-
          python -m service_operations validate
          --input .ci-output/service_requests.csv
          --contract contracts/service_requests.contract.json
          --report .ci-output/validation_report.json
          --expect-total 1000
          --expect-invalid 11

      - name: Build local Medallion pipeline
        run: >-
          python -m service_operations build-medallion
          --input .ci-output/service_requests.csv
          --contract contracts/service_requests.contract.json
          --output .ci-output/medallion

      - name: Verify Medallion controls and committed evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          generated = json.loads(
              Path(".ci-output/medallion/medallion_manifest.json").read_text(encoding="utf-8")
          )
          committed = json.loads(
              Path("evidence/medallion_manifest.json").read_text(encoding="utf-8")
          )
          if generated != committed:
              raise SystemExit("Generated Medallion manifest differs from committed evidence.")

          expected_counts = {
              "bronze": 1000,
              "silver_valid": 989,
              "silver_rejected": 11,
              "gold_fact": 989,
          }
          for key, expected in expected_counts.items():
              if generated["row_counts"][key] != expected:
                  raise SystemExit(f"Unexpected {key} row count.")

          kpis = generated["kpis"]
          ranges = {
              "sla_compliance_rate": (0.93, 0.96),
              "reopen_rate": (0.05, 0.09),
              "escalation_rate": (0.07, 0.12),
              "open_backlog_rate": (0.10, 0.18),
          }
          for key, (lower, upper) in ranges.items():
              if not lower <= kpis[key] <= upper:
                  raise SystemExit(f"{key} is outside its documented design range.")

          if kpis["reopen_eligible_requests"] != kpis["closed_requests"]:
              raise SystemExit("Reopen KPI denominator is not the closed-ticket population.")
          if not all(generated["controls"].values()):
              raise SystemExit("One or more Medallion reconciliation controls failed.")
          print("Medallion controls, KPI ranges and evidence reconciliation passed.")

      - name: Build local SQL analytics layer
        run: >-
          python -m service_operations build-analytics
          --medallion .ci-output/medallion
          --sql-dir analytics/sql
          --output .ci-output/analytics

      - name: Verify SQL analytics controls and committed evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          import pandas as pd

          generated = json.loads(
              Path(".ci-output/analytics/analytics_manifest.json").read_text(encoding="utf-8")
          )
          committed = json.loads(
              Path("evidence/analytics_manifest.json").read_text(encoding="utf-8")
          )
          if generated != committed:
              raise SystemExit("Generated analytics manifest differs from committed evidence.")

          expected_counts = {
              "service_requests_enriched": 989,
              "sla_by_team": 5,
              "sla_by_category": 5,
              "sla_by_priority": 4,
              "sla_by_team_category": 15,
              "daily_service_operations": 90,
              "sla_breach_details": 34,
          }
          if generated["row_counts"] != expected_counts:
              raise SystemExit("Unexpected SQL analytics row counts.")
          if not all(generated["controls"].values()):
              raise SystemExit("One or more SQL analytics reconciliation controls failed.")
          if generated["global_kpis"]["sla_breaches"] != 34:
              raise SystemExit("Unexpected SLA breach population.")

          for name in ["sla_by_team", "sla_by_category", "sla_by_priority"]:
              actual = pd.read_csv(Path(".ci-output/analytics") / f"{name}.csv")
              expected = pd.read_csv(Path("evidence") / f"{name}.csv")
              pd.testing.assert_frame_equal(actual, expected, check_dtype=False)

          print("SQL analytics controls and evidence reconciliation passed.")

      - name: Upload pipeline and analytics evidence
        uses: actions/upload-artifact@v7
        with:
          name: service-operations-evidence-${{ matrix.os }}
          path: .ci-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
